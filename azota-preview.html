<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><title>Kiểm tra iframe cục bộ</title><style>body{margin:0;background:#faf4e4;color:#234b3c;font:16px/1.5 system-ui}main{max-width:1000px;margin:12px auto;padding:0 12px}label{display:block}select,button{font:inherit;padding:8px;margin:5px 0}iframe{display:block;width:100%;height:540px;border:0;background:#faf4e4;box-shadow:0 0 0 1px #cbd5b4;margin:auto}.phone iframe{max-width:390px}.hint{font-size:13px}a{color:#23664b}</style></head><body><main><label>Khung thử cục bộ, không phải trang Azota thật <select id="activity"><option value="hl1_kham_pha.html">Thử dịch câu của Sóc</option><option value="hl2_mo_phong.html">Ảnh mờ</option><option value="hl3_luyen_tap.html">Tự luyện và Q1</option><option value="bai-2/index.html">Bài 2 · Vườn học của Mít (Q3/Q4)</option><option value="bai3_y_tuong.html">Bài 3 · Q5/Q6</option><option value="bai4_cai_tien.html">Bài 4 · Q7</option></select></label><button id="phone">Đổi desktop / điện thoại</button><iframe id="activity-frame" title="Hoạt động thử nhúng" allow="clipboard-write; clipboard-read"></iframe><p class="hint">Khung cao 540 px. Vuốt dọc bên trong để cuộn. <a href="khoa_hoc.html">Mở mục lục ngoài iframe</a></p></main><script>const params=new URLSearchParams(location.search),select=document.querySelector('#activity'),frame=document.querySelector('iframe');if([...select.options].some(o=>o.value===params.get('page')))select.value=params.get('page');function load(){frame.src=select.value+(params.has('legacy')?'':'?embed=azota')}select.onchange=load;document.querySelector('#phone').onclick=()=>document.body.classList.toggle('phone');load();</script></body></html>
